[project]
name = "trialmatch-rag"
version = "0.1.0"
description = "Eligibility-aware retrieval and reasoning for patient-to-clinical-trial matching (TREC Clinical Trials 2021/2022)"
requires-python = ">=3.12"
dependencies = [
    "fsspec==2026.6.0",
    "google-genai==2.20.0",
    # Import truc tiep trong src/extraction/gemini.py, khong phai qua google-genai.
    # Truoc day no chi co mat vi la dependency bac cau cua google-genai — nghia la
    # tang extraction se hong im lang neu google-genai doi client HTTP. Khai bao
    # rieng vi code goi thang no.
    "httpx==0.28.1",
    "huggingface-hub==1.29.0",
    "ir-datasets==0.6.3",
    "lxml==6.1.2",
    "numpy==2.5.2",
    "python-dotenv==1.2.3",
    "pytrec-eval-terrier==0.5.10",
    "requests==2.34.2",
    "scipy==1.18.1",
    "tqdm==4.70.0",
    # Phase 5/7/8 (dense retrieval, reranking, eligibility reasoning) da dung cac
    # goi nay tu truoc nhung chua tung khai bao — cai sa trong .venv nhung `uv sync`
    # tron se xoa mat vi khong nam trong pyproject.toml. Khai bao lai dung ban dang
    # cai de `uv sync --inexact` tai lap duoc; day la dieu kien de tieu chi thoat
    # "cold start tren may sach" cua specs/10 la that, khong chi danh cho API moi.
    "torch==2.13.0",
    "sentence-transformers==6.0.0",
    "transformers==5.16.1",
    "pyserini==2.3.0",
    # Phase 10 — demo web song.
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "sse-starlette==3.4.8",
]
